name: Update and publish Inbox

on:
  schedule:
    # Shanghai 10:17 and 14:17. Only a new complete batch invokes the model.
    - cron: '17 2,6 * * *'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements-pipeline.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inbox-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Dong1017/ai-systems-inbox' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      digest_sha: ${{ steps.hash.outputs.sha }}
      state: ${{ steps.collect.outputs.state }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Install collector dependency
        run: python3 -m pip install -r requirements-pipeline.txt
      - name: Test before collecting or using credentials
        run: python3 -m unittest discover -s tests -v
      - name: Collect and conditionally generate
        id: collect
        env:
          INBOX_GENERATION_ENABLED: ${{ vars.INBOX_GENERATION_ENABLED }}
          INBOX_GEMINI_API_KEY: ${{ secrets.INBOX_GEMINI_API_KEY }}
        run: python3 scripts/update_digest.py
      - name: Validate public data and publication boundary
        run: python3 scripts/validate_site.py
      - name: Persist results for idempotency and resume
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site/digests.json
          if [ -f data/generation-cache.json ]; then git add -- data/generation-cache.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh cs.DC pipeline state'
            # No force-push. A concurrent incompatible update must fail visibly.
            git push origin HEAD:main
          fi
      - name: Record exact public payload hash
        id: hash
        run: echo "sha=$(sha256sum site/digests.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload only the public site directory
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy public reading site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact deployed data, not a stale successful page
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.digest_sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, time
          from urllib.request import Request, urlopen
          from urllib.parse import urlsplit
          from urllib.error import URLError
          base = os.environ['SITE_URL'].rstrip('/') + '/'
          if base != 'https://dong1017.github.io/ai-systems-inbox/':
              raise ValueError('Unexpected deployment URL')
          def read(path, mime):
              req = Request(base + path, headers={'Cache-Control': 'no-cache', 'User-Agent': 'Inbox-Public-Check'})
              with urlopen(req, timeout=20) as r:
                  if r.status != 200 or r.geturl() != base + path or r.headers.get_content_type() != mime:
                      raise ValueError('Unexpected response')
                  data = r.read(10_000_001)
              if len(data) > 10_000_000:
                  raise ValueError('Response too large')
              return data
          for attempt in range(6):
              try:
                  html = read('', 'text/html')
                  if b'AI Systems' not in html or b'./digests.json' not in html:
                      raise ValueError('Wrong homepage')
                  raw = read('digests.json', 'application/json')
                  if hashlib.sha256(raw).hexdigest() != os.environ['EXPECTED_SHA']:
                      raise ValueError('CDN has not served this run yet')
                  d = json.loads(raw)
                  print('PASS: public HTML and exact digest SHA-256')
                  print('Batches:', len(d['digests']), 'Pipeline:', d.get('pipeline', {}).get('state'))
                  break
              except (URLError, OSError, ValueError):
                  if attempt == 5: raise
                  time.sleep(10)
          PY
      - name: Report collection and generation separately from deployment
        env:
          PIPELINE_STATE: ${{ needs.prepare.outputs.state }}
        run: |
          case "$PIPELINE_STATE" in
            waiting_model) echo '::warning::Model not authorized. Collection and publishing work, but automatic Chinese analysis is not active.' ;;
            waiting_quota) echo '::warning::Quota reached; valid progress saved for the next check. No partial digest published.' ;;
            generated|no_new) echo "Pipeline: $PIPELINE_STATE" ;;
            *) echo "::error::Pipeline $PIPELINE_STATE. Status page deployed; previous complete digests preserved."; exit 1 ;;
          esac
